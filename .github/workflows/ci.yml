name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: CI (Linux)
    permissions:
      contents: read
      packages: read
    uses: open-lobotomy/.github/.github/workflows/dotnet-ci.yml@7a468e9fb299bd697562143b780e7edf772258f6
    with:
      private-references-repo: ${{ vars.PRIVATE_REFERENCES_REPO }}
    secrets:
      PRIVATE_REFERENCES_TOKEN: ${{ secrets.PRIVATE_REFERENCES_TOKEN }}

  ci_windows:
    name: CI (Windows)
    permissions:
      contents: read
      packages: read
    uses: open-lobotomy/.github/.github/workflows/dotnet-ci-windows.yml@7a468e9fb299bd697562143b780e7edf772258f6
    with:
      solution-file: ConfigurationManager.slnx
      private-references-repo: ${{ vars.PRIVATE_REFERENCES_REPO }}
    secrets:
      PRIVATE_REFERENCES_TOKEN: ${{ secrets.PRIVATE_REFERENCES_TOKEN }}

  status:
    name: CI
    needs: [ci, ci_windows]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        run: |
          if [ "${{ needs.ci.result }}" != "success" ] || [ "${{ needs.ci_windows.result }}" != "success" ]; then
            exit 1
          fi
